<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Happy Birthday 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at top, #25204a, #090909 70%);
            font-family: Tahoma, Arial, sans-serif;
            color: white;
            touch-action: none;
        }

        /* صفحه اصلی */
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* عنوان */
        .title {
            font-size: clamp(35px, 8vw, 70px);
            font-weight: bold;
            text-align: center;
            background: linear-gradient(90deg,
                    #ffcc00,
                    #ff66cc,
                    #00ffff);
            -webkit-background-clip: text;
            color: transparent;
            animation: glow 2s infinite alternate;
            z-index: 5;
        }

        .subtitle {
            margin-top: 15px;
            font-size: clamp(18px, 4vw, 30px);
            color: #fff;
            opacity: .9;
            animation: fade 3s infinite alternate;
        }


        @keyframes glow {
            from {
                filter: drop-shadow(0 0 10px #ffcc00);
            }

            to {
                filter: drop-shadow(0 0 30px #ff00cc);
            }
        }


        @keyframes fade {
            from {
                opacity: .5;
            }

            to {
                opacity: 1;
            }
        }


        /* جای کیک */
        .cake-area {
            margin-top: 50px;
            position: relative;
            width: 300px;
            height: 250px;
        }


        /* پایه کیک */
        .cake {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 120px;
            background: #ff8fab;
            border-radius: 20px 20px 10px 10px;
            box-shadow:
                0 15px 30px rgba(255, 0, 120, .5);
        }


        /* خامه */
        .cream {
            position: absolute;
            top: -25px;
            left: 0;
            width: 100%;
            height: 40px;
            background: white;
            border-radius: 50%;
        }


        /* لایه کیک */
        .layer {
            position: absolute;
            width: 260px;
            height: 50px;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffcad4;
            border-radius: 20px;
        }


        .layer2 {
            position: absolute;
            width: 190px;
            height: 45px;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffe5ec;
            border-radius: 20px;
        }


        /* شمع */
        .candle {
            position: absolute;
            width: 18px;
            height: 60px;
            background: #fff;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
        }


        .flame {
            position: absolute;
            width: 22px;
            height: 30px;
            background: orange;
            border-radius: 50%;
            top: -30px;
            left: -2px;
            animation: fire .5s infinite alternate;
        }


        @keyframes fire {
            from {
                transform: scale(.8);
                opacity: .7;
            }

            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* =====================
   BALLOONS
===================== */

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 55px;
            height: 75px;
            border-radius: 50%;
            opacity: .85;
            animation: float 10s linear infinite;
            z-index: 1;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -45px;
            left: 50%;
            width: 2px;
            height: 45px;
            background: white;
        }


        .balloon:nth-child(1) {
            left: 10%;
            background: #ff4d6d;
            animation-delay: 0s;
        }

        .balloon:nth-child(2) {
            left: 30%;
            background: #00d4ff;
            animation-delay: 2s;
        }

        .balloon:nth-child(3) {
            left: 70%;
            background: #ffd60a;
            animation-delay: 4s;
        }

        .balloon:nth-child(4) {
            left: 85%;
            background: #c77dff;
            animation-delay: 1s;
        }


        @keyframes float {

            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-50vh) rotate(15deg);
            }

            100% {
                transform: translateY(-120vh) rotate(-15deg);
            }

        }



        /* =====================
      STARS
===================== */

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }


        @keyframes twinkle {

            from {
                opacity: .2;
                transform: scale(.5);
            }

            to {
                opacity: 1;
                transform: scale(1.8);
            }

        }


        /* قلب های کوچک */

        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 25px;
            animation: heartMove 6s linear infinite;
        }


        @keyframes heartMove {

            0% {
                bottom: -50px;
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                bottom: 110vh;
                opacity: 0;
                transform: rotate(360deg);
            }

        }


        /* موبایل */

        @media(max-width:600px) {

            .cake-area {
                transform: scale(.8);
            }

        }

        /* =====================
      FIREWORKS
===================== */

        #fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* =====================
      GIFT BOX
===================== */

        .gift-box {

            width: 120px;
            height: 100px;
            background: #ff006e;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
            cursor: pointer;
            z-index: 6;

            box-shadow:
                0 0 25px #ff006e;

            transition: .6s;

        }


        .gift-box:hover {

            transform:
                translateX(-50%) scale(1.1);

        }


        .gift-lid {

            width: 130px;
            height: 25px;
            background: #ffd60a;
            position: absolute;
            top: -15px;
            left: -5px;
            border-radius: 10px;

        }


        .ribbon {

            width: 20px;
            height: 100%;
            background: #ffd60a;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);

        }



        .open {

            animation: openGift 1s forwards;

        }



        @keyframes openGift {

            0% {

                transform:
                    translateX(-50%) rotate(0);

            }


            100% {

                transform:
                    translateX(-50%) translateY(-120px) rotate(25deg);

            }

        }



        /* متن سورپرایز */

        .message {

            position: absolute;

            top: 55%;

            text-align: center;

            font-size: 25px;

            opacity: 0;

            transform: scale(.5);

            transition: 1s;

            z-index: 7;
            color: #ff006e;

        }



        .show-message {

            opacity: 1;

            transform: scale(1);

        }



        /* دکمه */

        button {

            margin-top: 25px;

            padding: 12px 35px;

            border: none;

            border-radius: 30px;

            background:
                linear-gradient(45deg,
                    #ff006e,
                    #8338ec);

            color: white;

            font-size: 18px;

            cursor: pointer;

            box-shadow:
                0 0 20px #ff006e;

        }


        /* =====================
    TYPE EFFECT
===================== */

        .typing {

            margin-top: 20px;

            font-size: clamp(18px, 4vw, 30px);

            color: #fff;

            min-height: 40px;

            text-shadow:
                0 0 10px #ff00cc,
                0 0 20px #00ffff;

        }



        /* نور دور صفحه */

        .glow {

            position: absolute;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    rgba(255, 0, 150, .4),
                    transparent 70%);

            animation: pulse 3s infinite;

        }



        @keyframes pulse {

            0% {
                transform: scale(.8);
                opacity: .3;
            }


            50% {
                transform: scale(1.2);
                opacity: .7;
            }


            100% {
                transform: scale(.8);
                opacity: .3;
            }

        }

        /* =====================
      FINAL EFFECTS
===================== */


        /* لرزش آرام کیک */

        .cake-area {

            animation:
                cakeMove 3s infinite ease-in-out;

        }


        @keyframes cakeMove {

            0%,
            100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-10px);

            }

        }



        /* نور زیر کیک */

        .cake-area::after {

            content: "";

            position: absolute;

            bottom: 5px;

            left: 50%;

            transform: translateX(-50%);

            width: 260px;

            height: 30px;

            background:
                radial-gradient(ellipse,
                    rgba(255, 200, 0, .6),
                    transparent);

            filter: blur(10px);

        }



        /* دکمه درخشش */

        button {

            animation:
                buttonGlow 2s infinite alternate;

        }


        @keyframes buttonGlow {

            from {

                box-shadow:
                    0 0 10px #ff006e;

            }


            to {

                box-shadow:
                    0 0 35px #00ffff;

            }

        }



        /* موبایل */

        @media(max-width:600px) {

            body {

                overflow: hidden;

            }


            .title {

                margin-top: -50px;

            }


            .gift-box {

                transform:
                    translateX(-50%) scale(.85);

            }


        }

        @media(max-width:600px) {

            .cake-area {
                transform: scale(.7);
            }

            .title {
                font-size: 40px;
            }

            .subtitle {
                font-size: 18px;
            }

            button {
                font-size: 16px;
                padding: 10px 25px;
            }

        }
    </style>
</head>


<body>
    <audio id="music" loop>

        <source src="https://cdn.pixabay.com/audio/2022/10/26/audio_8c9d6d8f4c.mp3" type="audio/mpeg">

    </audio>
    <canvas id="fireworks"></canvas>
    <div class="container">

        <h1 class="title">
            Happy Birthday Arvin 🎉
        </h1>

        <p class="subtitle">
            برای یک روز خاص و یک آدم خاص که توی مرد ❤️
        </p>
        <div class="typing" id="typing"></div>

        <div class="cake-area">

            <div class="layer"></div>

            <div class="layer2"></div>

            <div class="cake">
                <div class="cream"></div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

            </div>

        </div>

        <div class="gift-box" onclick="openGift()">

            <div class="gift-lid"></div>

            <div class="ribbon"></div>

        </div>


        <div class="message" id="message">

            🎉 تولدت مبارک اروین 🎉
            <br>
            امیدوارم همیشه بدرخشی ❤️

        </div>


        <!-- <button onclick="openGift()">
            باز کردن هدیه 🎁
        </button> -->
    </div>
    <!-- بادکنک ها -->

    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>


    <!-- ستاره ها -->

    <div class="star" style="top:10%;left:20%"></div>
    <div class="star" style="top:25%;left:80%"></div>
    <div class="star" style="top:60%;left:15%"></div>
    <div class="star" style="top:75%;left:70%"></div>
    <div class="star" style="top:40%;left:50%"></div>


    <!-- قلب ها -->

    <div class="heart" style="left:20%;animation-delay:1s">🐦🐦‍🔥👻😍🥰🤩😶‍🌫️</div>
    <div class="heart" style="left:60%;animation-delay:3s">🐦‍🔥👻😍🥰🤩😶‍🌫️</div>
    <div class="heart" style="left:80%;animation-delay:5s">👻😍🥰🤩😶‍🌫️</div>

    <script>

        const canvas = document.getElementById("fireworks");
        const ctx = canvas.getContext("2d");


        function resize() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        }

        resize();

        window.addEventListener("resize", resize);



        let particles = [];



        class Particle {

            constructor(x, y, color) {

                this.x = x;
                this.y = y;

                this.color = color;

                this.size = Math.random() * 4 + 1;

                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;

                this.life = 100;

            }


            update() {

                this.x += this.speedX;
                this.y += this.speedY;

                this.life--;

                this.size *= 0.97;

            }


            draw() {

                ctx.beginPath();

                ctx.fillStyle = this.color;

                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            }

        }



        function explosion(x, y) {

            let colors = [
                "#ff0054",
                "#ffbe0b",
                "#00f5d4",
                "#9b5de5",
                "#ffffff"
            ];


            for (let i = 0; i < 45; i++) {

                particles.push(
                    new Particle(
                        x,
                        y,
                        colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                        ]
                    )
                );

            }

        }



        function animate() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            particles.forEach(
                (p, index) => {

                    p.update();

                    p.draw();


                    if (p.life <= 0) {
                        particles.splice(index, 1);
                    }

                }
            );


            requestAnimationFrame(animate);

        }


        animate();



        setInterval(() => {


            let x =
                Math.random() * canvas.width;


            let y =
                Math.random() *
                (canvas.height * 0.6);


            explosion(x, y);


        }, 1500);

        function openGift() {

            let gift = document.querySelector(".gift-box");

            let msg = document.getElementById("message");


            gift.classList.add("open");


            setTimeout(() => {

                msg.classList.add(
                    "show-message"
                );


                explosion(
                    window.innerWidth / 2,
                    window.innerHeight / 2
                );


            }, 800);

        }

        const text =
            "امروز روز توئه... لبخند بزن و بدرخش ✨";


        let index = 0;


        function typing() {

            if (index < text.length) {

                document
                    .getElementById("typing")
                    .innerHTML += text[index];

                index++;

                setTimeout(
                    typing,
                    100
                );

            }

        }


        typing();



        document.body.addEventListener(
            "click",
            () => {

                let music =
                    document.getElementById("music");


                music.play()
                    .catch(() => { });


            },
            {
                once: true
            });

        // ساخت ستاره های بیشتر

        for (let i = 0; i < 40; i++) {

            let star = document.createElement("div");

            star.className = "star";


            star.style.top =
                Math.random() * 100 + "%";


            star.style.left =
                Math.random() * 100 + "%";


            star.style.animationDelay =
                Math.random() * 3 + "s";


            document.body.appendChild(star);

        }



        // ساخت قلب های بیشتر

        setInterval(() => {


            let heart = document.createElement("div");

            heart.className = "heart";

            heart.innerHTML = "❤️";


            heart.style.left =
                Math.random() * 100 + "%";


            heart.style.fontSize =
                (15 + Math.random() * 25) + "px";


            document.body.appendChild(heart);



            setTimeout(() => {

                heart.remove();

            }, 6000);



        }, 1200);
    </script>
</body>

</html>
